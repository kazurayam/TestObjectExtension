plugins {
    id 'groovy'
    id 'com.vanniktech.maven.publish' version '0.34.0'
}

group = 'com.kazurayam'
version = '0.1.4'

repositories {
    mavenCentral()
    mavenLocal()
}

ext {
    groovyVersion = '3.0.17'
    seleniumVersion = '4.22.0'
    KATALON_STUDIO_INSTALLATION_DIR = '/Applications/Katalon Studio.app/Contents/Eclipse'
}

FileCollection katalonJars = layout.files(
    // Katalon Studio v10.0.0
    "${KATALON_STUDIO_INSTALLATION_DIR}/plugins/com.kms.katalon.core.webui_1.0.0.202410300525.jar",
    "${KATALON_STUDIO_INSTALLATION_DIR}/plugins/com.kms.katalon.core_1.0.0.202410300525.jar"
    )

configurations {
    generateDocs
}

dependencies {
  compileOnly("org.codehaus.groovy:groovy-all:${groovyVersion}")
  compileOnly("org.seleniumhq.selenium:selenium-java:${seleniumVersion}")
  compileOnly katalonJars
  generateDocs("org.codehaus.groovy:groovy-all:${groovyVersion}")
}

tasks.register('listJars') {
    description "FOR DEBUG: list all jar files in the ${KATALON_STUDIO_INSTALLATION_DIR}/configuration/resources/lib directory"
    doLast {
        FileCollection fileCollection = fileTree("${KATALON_STUDIO_INSTALLATION_DIR}/configuration/resources/lib") { include '*.jar' }
        fileCollection.sort().each { file ->
            println file
        }
    }
}

sourceSets {
    main {
        groovy {
            srcDirs = ['Keywords']
            excludes = ["CustomKeywords.groovy", "internal/GlobalVariable.groovy", "**/Temp*.groovy"]
        }
    }
}

java {
    toolchain {
        // Katalon Studio v10.0.0 bundles JDK17
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// $ gradle publishToMavenCentral
// $ gradle publishToMavenLocal
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(project.group,              // com.kazurayam
                project.rootProject.name,   // TestObjectExtension
                project.version)            // e.g, 0.1.4-SNAPSHOT

    pom {
        name.set(project.rootProject.name)
        description = 'A Katalon Studio plugin that extends the TestObject class with new methods'
        inceptionYear.set('2020')
        url.set('https://kazurayam.github.io/TestObjectExtention/')
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org.licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id.set('kazurayam')
                name.set('URAYAMA,kazuaki')
                email.set('kazuaki.urayama@gmail.com')
            }
        }
        scm {
            connection = "scm:git:https://github.com/kazurayam/${project.rootProject.name}.git"
            developerConnection = "scm:git:git@github.com:kazurayam/${project.rootProject.name}.git"
            url = "https://github.com/kazurayam/${project.rootProject.name}"
        }
    }
}
/*
 * ~/.gradle/gradle.properites should contain the following properites:
mavenCentralUsername=your-username
mavenCentralPassword=your-password
signing.keyId=12345678
signing.password=some_password
signing.secretKeyRingFile=/Users/yourusername/.gnupg/secring.gpg
 */

task groovydoc(type: Groovydoc, overwrite:true) {
    group = 'com.kazurayam'
    source = sourceSets.main.groovy
    classpath = configurations.generateDocs
    groovyClasspath = configurations.generateDocs
    include 'com/kazurayam/ks/*'
    exclude '**/*Test.groovy'
}
task publishGroovydoc(type: Copy) {
    from 'build/docs/groovydoc'
    into 'docs/api'
}
groovydoc.finalizedBy publishGroovydoc

task groovydocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from groovydoc
}

task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}
