plugins {
    id 'groovy'
    id 'maven-publish'
    id 'signing'
}

group = 'com.kazurayam'
version = '0.1.4'

ext {
  isReleaseVersion = ! version.endsWith("SNAPSHOT")
  KATALON_STUDIO_INSTALLATION_DIR = '/Applications/Katalon Studio.app/Contents/Eclipse'
}

configurations {
  generateDocs
}

repositories {
  mavenCentral()
  mavenLocal()
}

FileCollection bundledJars = layout.files(
    "${KATALON_STUDIO_INSTALLATION_DIR}/plugins/com.kms.katalon.core.webui_1.0.0.202410300525.jar",
    "${KATALON_STUDIO_INSTALLATION_DIR}/plugins/com.kms.katalon.core_1.0.0.202410300525.jar"
    )

dependencies {
  compileOnly("org.codehaus.groovy:groovy-all:3.0.17")
  compileOnly("org.seleniumhq.selenium:selenium-java:4.22.0")
  compileOnly bundledJars
}

tasks.register('listJars') {
    doLast {
        FileCollection fileCollection = fileTree("${KATALON_STUDIO_INSTALLATION_DIR}/configuration/resources/lib") { include '*.jar' }
        fileCollection.sort().each { file ->
            println file
        }
    }
}


sourceSets {
  main {
    groovy {
      srcDirs = ['Keywords']
      excludes = ["CustomKeywords.groovy", "internal/GlobalVariable.groovy", "Temp*.groovy"]
    }
  }
  test {
    groovy {
      srcDirs = ['Include/scripts/groovy']
    }
  }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

task groovydoc(type: Groovydoc, overwrite:true) {
  group = 'com.kazurayam'
  source = sourceSets.main.groovy
  classpath = configurations.compileClasspath
  groovyClasspath = project.configurations.generateDocs
  include 'com/kazurayam/**'
  exclude '**/*Test.groovy'
}
task publishGroovydoc(type: Copy) {
    from 'build/docs/groovydoc'
    into 'docs/api'
}
groovydoc.finalizedBy publishGroovydoc

task groovydocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from groovydoc
}

task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

publishing {
    publications {
        testobjectextension(MavenPublication) {
            artifact sourcesJar
            artifact groovydocJar
            pom {
                groupId = project.group
                name = project.rootProject.name
                description = 'A Katalon Studio plugin that extends the TestObject class with new methods'
                url = 'https://kazurayam.github.io/TestObjectExtention/'
                from components.java
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org.licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'kazurayam'
                        name = 'URAYAMA,kazuaki'
                        email = 'kazuaki.urayama@gmail.com'
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/kazurayam/${project.rootProject.name}.git"
                    developerConnection = "scm:git:git@github.com:kazurayam/${project.rootProject.name}.git"
                    url = "https://github.com/kazurayam/${project.rootProject.name}"
                }
            }
        }
    }
    repositories {
        maven {
            def releaseRepo = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
            def snapshotRepo = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
            url = isReleaseVersion ? releaseRepo: snapshotRepo
            credentials {
                username = project.hasProperty('ossrhUsername') ? ossrhUsername : "Unknown user"
                password = project.hasProperty('ossrhPassword') ? ossrhPassword : "Unknown password"
            }
        }
    }
}

signing {
    sign publishing.publications.testobjectextension
}
